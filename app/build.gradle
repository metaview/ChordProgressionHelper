plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.3.0'
}

import org.jetbrains.kotlin.gradle.dsl.JvmTarget

android {
    namespace = 'de.metaviewsoft.chordprogressionhelper'
    compileSdk 36

    defaultConfig {
        applicationId "de.metaviewsoft.chordprogressionhelper"
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName APP_VERSION_NAME

        buildConfigField "String", "VERSION_NAME", "\"${APP_VERSION_NAME}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // NDK configuration for native audio library
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            // Reproducible builds: strip native debug symbols so the packaged .so
            // files don't depend on the build environment.
            debugSymbolLevel 'none'
        }
        externalNativeBuild {
            cmake {
                // -ffile-prefix-map removes the absolute build path from the binaries
                // so a build in a different directory (e.g. F-Droid's) stays byte-identical.
                cppFlags "-std=c++17 -O3 -ffast-math -Wall -ffile-prefix-map=${rootDir}=."
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

    // Properties aus local.properties laden
    def localProperties = new Properties()
    def localPropertiesFile = rootProject.file('local.properties')
    if (localPropertiesFile.exists()) {
        localPropertiesFile.withInputStream { localProperties.load(it) }
    }

    def hasReleaseSigning = [
        'RELEASE_STORE_FILE',
        'RELEASE_STORE_PASSWORD',
        'RELEASE_KEY_ALIAS',
        'RELEASE_KEY_PASSWORD'
    ].every { key ->
        def value = localProperties.getProperty(key)
        value != null && !value.trim().isEmpty()
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(localProperties.getProperty('RELEASE_STORE_FILE'))
                storePassword localProperties.getProperty('RELEASE_STORE_PASSWORD')
                keyAlias localProperties.getProperty('RELEASE_KEY_ALIAS')
                keyPassword localProperties.getProperty('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            } else {
                // Allow local builds to proceed even when release secrets are not set.
                signingConfig = signingConfigs.debug
            }
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
            freeCompilerArgs.add("-opt-in=kotlinx.serialization.InternalSerializationApi")
        }
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version = "3.22.1"
        }
    }
    ndkVersion = "27.0.12077973"
}

// Configure Zip tasks globally so APK/ZIP entries are reproducible across environments
// This approach works with Gradle's Zip task properties and avoids relying on the
// android->packagingOptions API that may differ between AGP versions.
tasks.withType(Zip).configureEach { zipTask ->
    preserveFileTimestamps = false
    // Set reproducibleFileOrder only when the property exists on the task (safer compatibility check)
    if (zipTask.hasProperty('reproducibleFileOrder')) {
        zipTask.reproducibleFileOrder = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation("androidx.mediarouter:mediarouter:1.8.1")
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.10.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation('org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0')

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
