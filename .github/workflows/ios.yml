# iOS build on GitHub's macOS runners — the primary iOS build path while no Mac is at hand.
# The Linux/F-Droid Android build is completely independent of this (iOS targets are only
# activated via -PenableIosTargets=true, which nothing on Linux sets).
name: iOS

on:
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - '.github/workflows/ios.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Fail fast with readable Kotlin errors before involving Xcode.
      - name: Build shared framework (iOS simulator)
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 -PenableIosTargets=true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Build iOS app (simulator, unsigned)
        working-directory: iosApp
        run: |
          xcodebuild \
            -project ChordProgressionHelper.xcodeproj \
            -scheme ChordProgressionHelper \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Runtime smoke test: boot a simulator, install and launch the app, and fail if it
      # crashes on startup. This is the first proof the shared framework actually RUNS
      # (platform seams install, SwiftUI builds views off the StateFlow bridge), not just links.
      - name: Smoke test (boot, launch, crash check)
        working-directory: iosApp
        run: |
          set -uo pipefail
          BUNDLE_ID=de.metaviewsoft.chordprogressionhelper

          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then echo "::error::built .app not found"; exit 1; fi
          echo "App bundle: $APP"

          # Pick any available iPhone simulator; create one if the runner has none.
          UDID_RE='[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}'
          DEVICE=$(xcrun simctl list devices available | grep 'iPhone' | grep -oE "$UDID_RE" | head -1 || true)
          if [ -z "$DEVICE" ]; then
            echo "No iPhone simulator preinstalled; creating one."
            RUNTIME=$(xcrun simctl list runtimes available | grep -oE 'com.apple.CoreSimulator.SimRuntime.iOS[^ ]*' | head -1)
            DEVICE=$(xcrun simctl create smoke "iPhone 16" "$RUNTIME")
          fi
          echo "Device UDID: $DEVICE"

          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE" -b

          xcrun simctl install "$DEVICE" "$APP"

          rm -f ~/Library/Logs/DiagnosticReports/ChordProgressionHelper* 2>/dev/null || true

          # Capture the in-app self-test via the simulator's UNIFIED LOG, not the app's stdout.
          # `simctl launch --console-pty` redirected to a file goes empty on newer Xcode/simulator
          # runner images (the app runs fine, but not a byte reaches the file), which silently broke
          # this check. The self-test now also emits every line via os_log on a dedicated subsystem
          # (see SmokeSelfTest.swift), and we stream exactly that subsystem — a stable channel.
          #
          # Start the log stream BEFORE launching so no early lines are missed; the 2s settle lets it
          # attach. SIMCTL_CHILD_CPH_SMOKE=1 is forwarded into the app's environment, enabling the
          # SmokeSelfTest: it drives the shared core through SongModel and asserts each change
          # round-trips back through the StateFlow -> @Published bridge, emitting "SMOKE-SELFTEST: PASS"
          # on success. That proves the Kotlin<->SwiftUI binding actually WORKS at runtime.
          echo "Starting unified-log stream (subsystem de.metaviewsoft.smoke) ..."
          xcrun simctl spawn "$DEVICE" log stream \
            --level debug --style compact \
            --predicate 'subsystem == "de.metaviewsoft.smoke"' > app-log.log 2>&1 &
          LOG_PID=$!
          sleep 2

          echo "Launching $BUNDLE_ID ..."
          SIMCTL_CHILD_CPH_SMOKE=1 xcrun simctl launch "$DEVICE" "$BUNDLE_ID"

          # Let the self-test run through all its async steps (playback, pattern editors, library
          # round-trip). The in-app watchdog emits a FAIL sentinel at 25s if a step wedges, so wait
          # past that to capture it rather than racing it.
          sleep 28

          kill "$LOG_PID" 2>/dev/null || true
          wait "$LOG_PID" 2>/dev/null || true

          echo "----- self-test log -----"
          cat app-log.log 2>/dev/null || echo "(no log captured)"
          echo "-------------------------"

          # A startup crash never reaches PASS; surface the crash report so the failure is actionable.
          CRASHES=$(find ~/Library/Logs/DiagnosticReports -name 'ChordProgressionHelper*' 2>/dev/null || true)
          if [ -n "$CRASHES" ]; then
            echo "----- crash report(s) -----"
            for f in $CRASHES; do echo "===== $f ====="; cat "$f"; done
            echo "::error::App produced a crash report during the smoke window. See report above."
            exit 1
          fi

          if grep -q 'SMOKE-SELFTEST: FAIL' app-log.log; then
            echo "::error::In-app self-test reported failures (StateFlow<->SwiftUI binding). See log above."
            exit 1
          fi
          if ! grep -q 'SMOKE-SELFTEST: PASS' app-log.log; then
            echo "::error::In-app self-test did not reach PASS (no sentinel) — app may have failed to launch or stalled. See log above."
            exit 1
          fi
          echo "✅ Smoke test passed: the StateFlow<->SwiftUI self-test PASSED (captured via unified log)."
