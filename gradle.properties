# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX and Kotlin
android.useAndroidX=true
kotlin.code.style=official

# R class optimization (non-transitive R classes enabled by default in AGP 8+)
android.nonTransitiveRClass=true

# Gradle configuration cache
org.gradle.configuration-cache=true

# App Version (zentrale Definition)
APP_VERSION_CODE=6
APP_VERSION_NAME=1.01

# Use JDK 17 for Gradle tooling to avoid incompatibilities with newer JDKs
#org.gradle.java.home=%JAVA_HOME%

# If you prefer to use another JDK, adjust the path above accordingly.
